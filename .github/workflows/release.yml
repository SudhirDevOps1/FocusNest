name: FocusNest Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag override when triggered manually (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Verify, Package & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Zero-Internet Manifest Privacy Gate
        run: |
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "::error::PRIVACY VIOLATION: android.permission.INTERNET found in AndroidManifest.xml"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode Optional Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured from repository secrets."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret configured; assembling unsigned release + debug verification APK."
          fi

      - name: Run Verification Suite & Build Release
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect Artifacts & Compute SHA256SUMS
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/debug/*.apk release-dist/ || true
          cp app/build/outputs/apk/release/*.apk release-dist/ || true
          cp app/build/outputs/bundle/release/*.aab release-dist/ || true
          (cd release-dist && sha256sum * > SHA256SUMS.txt)
          cat release-dist/SHA256SUMS.txt

      - name: Clean Ephemeral Keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-dist/*
